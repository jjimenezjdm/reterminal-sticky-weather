# =====================================================================
#  Sticky Casa – reTerminal Sticky weather panel
#  · Temperatura y humedad de casa   → sensor SHT40 interno
#  · Temperatura de la calle         → Open-Meteo
#  · ¿Paraguas en la próxima hora?   → Buienradar (radar, cada 5 min)
#
#  FUNCIONA CON BATERÍA: se despierta, actualiza la pantalla y vuelve a
#  dormir. La tinta electrónica conserva la imagen sin gastar nada.
#    · Horas punta (12:30–13:30 y 17:30–18:30): cada 10 min
#    · Resto del día (06:00–24:00): cada 30 min
#    · De noche (00:00–06:00): duerme del tirón y vuelve a las 06:00
#    · Batería por debajo del 20 %: como mucho cada 30 min; por debajo
#      del 15 % avisa en pantalla para que lo cargues
#    · Botón AI/OK: lo despierta y actualiza al momento (también de noche)
#    · Botón ARRIBA (mientras está despierto): modo mantenimiento, no se
#      duerme (para actualizar por WiFi). Botón ABAJO: sale y se duerme.
#  Requiere ESPHome 2026.7.0 o superior.
# =====================================================================

substitutions:
  # Tu ubicación y zona horaria van en secrets.yaml (no se publican)
  lat: !secret latitud
  lon: !secret longitud
  zona_horaria: !secret zona_horaria
  umbral_mmh: "0.2"        # lluvia (mm/h) a partir de la cual coges paraguas
  minutos_dia: "30"        # cada cuánto se despierta de día (fuera de las horas punta)
  minutos_punta: "10"      # cada cuánto se despierta en las horas punta
  # Horas punta, como "desde, hasta" en minutos (hora*60 + minutos)
  punta1: "12*60+30, 13*60+30"   # 12:30 – 13:30
  punta2: "17*60+30, 18*60+30"   # 17:30 – 18:30
  bateria_ahorro: "20"     # % por debajo del cual actualiza como mucho cada 30 min
  bateria_aviso: "15"      # % por debajo del cual avisa en pantalla
  hora_dormir: "0"         # a partir de esta hora no se actualiza (0 = medianoche, 23 = 23:00)
  hora_despertar: "6"      # primera actualización de la mañana (06:00)

esphome:
  name: sticky-casa
  friendly_name: Sticky Casa
  min_version: 2026.7.0
  includes:
    - sticky_casa.h       # memoria que sobrevive al sueño (tendencias, repintado)
  on_boot:
    # Lo primero de todo: soltar los pines que se dejaron "congelados" al
    # dormir, sin dejar caer nunca la alimentación (GPIO45/46 en ALTO).
    - priority: 1000
      then:
        - lambda: |-
            for (int pin : {45, 46}) {
              gpio_num_t p = (gpio_num_t) pin;
              gpio_set_direction(p, GPIO_MODE_OUTPUT);
              gpio_set_level(p, 1);
            }
            // Pantalla encendida (GPIO47 = alimentación de la tinta, activa en ALTO)
            gpio_set_direction(GPIO_NUM_47, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_47, 1);
            gpio_deep_sleep_hold_dis();
            for (int pin : {45, 46, 47, 4, 10, 38, 41, 42, 48}) gpio_hold_dis((gpio_num_t) pin);
            // Táctil, micrófono, microSD y zumbador apagados: no los usamos
            for (int pin : {42, 38, 10, 48}) {
              gpio_set_direction((gpio_num_t) pin, GPIO_MODE_OUTPUT);
              gpio_set_level((gpio_num_t) pin, 0);
            }
    # Si al despertar (con AI) se mantiene pulsado ▲: modo mantenimiento
    # desde el principio (no apaga el WiFi ni se duerme)
    - priority: 600
      then:
        - lambda: |-
            gpio_set_direction(GPIO_NUM_5, GPIO_MODE_INPUT);
            gpio_pullup_en(GPIO_NUM_5);
            delay(5);
            if (gpio_get_level(GPIO_NUM_5) == 0) {
              id(mantener) = true;
              id(dormir).prevent_deep_sleep();
              ESP_LOGI("mantenimiento", "▲ pulsado al arrancar: modo mantenimiento");
            }
    # Seguridad: si en 60 s no ha conseguido actualizar (p. ej. sin WiFi),
    # pinta lo que tenga (al menos la temperatura de casa) y se duerme.
    - priority: -100
      then:
        - delay: 60s
        - if:
            condition:
              not:
                script.is_running: actualizar
            then:
              - script.execute: sin_wifi

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: UART0      # el USB-C del Sticky va al chip CH343P (UART0)

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true          # conecta más rápido al despertar = menos batería
  on_connect:
    - script.execute: actualizar

time:
  - platform: sntp
    id: reloj
    timezone: ${zona_horaria}
    servers:
      - time.cloudflare.com
      - time.google.com
      - pool.ntp.org

# ---------------------------------------------------------------------
#  Alimentación
#  GPIO45 = power hold, GPIO46 = power lock (activos en ALTO)
#  GPIO39 = habilitar carga de batería (activo en BAJO)
# ---------------------------------------------------------------------
switch:
  - platform: gpio
    id: power_hold
    pin:
      number: GPIO45
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON
    internal: true
  - platform: gpio
    id: power_lock
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    restore_mode: ALWAYS_ON
    internal: true
  - platform: gpio
    id: cargador
    pin:
      number: GPIO39
      inverted: true
    restore_mode: ALWAYS_ON
    internal: true

deep_sleep:
  id: dormir
  sleep_duration: ${minutos_dia}min
  esp32_ext1_wakeup:
    pins:
      - GPIO4                 # botón AI/OK
    mode: ANY_LOW

# ---------------------------------------------------------------------
#  Buses
# ---------------------------------------------------------------------
i2c:
  - id: bus_sensores
    sda: GPIO1
    scl:
      number: GPIO0
      ignore_strapping_warning: true
    frequency: 400kHz

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14

# ---------------------------------------------------------------------
#  Datos
# ---------------------------------------------------------------------
globals:
  - id: minutos_lluvia      # -1 = no llueve en la próxima hora
    type: int
    initial_value: "-1"
  - id: hora_lluvia         # "HH:MM" en que empieza a llover
    type: std::string
    initial_value: '""'
  - id: lluvia_max_mmh
    type: float
    initial_value: "0"
  - id: lluvia_ok           # ¿hemos recibido datos de Buienradar?
    type: bool
    initial_value: "false"
  - id: espera_ms           # cuánto va a dormir la próxima vez
    type: uint32_t
    initial_value: "${minutos_dia} * 60 * 1000"
  - id: lluvia_mmh          # lluvia prevista (mm/h) cada 5 min, próximas 2 h
    type: std::array<float, 24>
  - id: lluvia_n            # cuántos tramos de 5 min nos ha dado Buienradar
    type: int
    initial_value: "0"
  - id: lluvia_inicio       # minutos desde medianoche del primer tramo
    type: int
    initial_value: "0"
  - id: lluvia_luego        # minutos hasta que llueva en la 2ª hora (-1 = seca)
    type: int
    initial_value: "-1"
  - id: codigo_tiempo       # código WMO de Open-Meteo (niebla, nieve...)
    type: int
    initial_value: "-1"
  - id: es_de_dia
    type: bool
    initial_value: "true"
  - id: noche               # la próxima espera es la de toda la noche
    type: bool
    initial_value: "false"
  - id: bateria_baja        # por debajo de ${bateria_aviso} %: avisar
    type: bool
    initial_value: "false"
  - id: br_ok               # ¿ha respondido Buienradar en este despertar?
    type: bool
    initial_value: "false"
  - id: om_mmh              # respaldo: lluvia de Open-Meteo cada 15 min (mm/h)
    type: std::array<float, 8>
  - id: om_n
    type: int
    initial_value: "0"
  - id: om_inicio           # minutos desde medianoche del primer tramo de 15 min
    type: int
    initial_value: "0"
  - id: tend_casa           # -1 bajando / 0 estable / 1 subiendo (última hora)
    type: int
    initial_value: "0"
  - id: tend_calle
    type: int
    initial_value: "0"
  - id: repintar            # ¿hay que refrescar la pantalla?
    type: bool
    initial_value: "true"
  - id: mantener            # modo mantenimiento: no dormir
    type: bool
    initial_value: "false"

sensor:
  - platform: sht4x
    id: sht40
    i2c_id: bus_sensores
    address: 0x44
    update_interval: never  # se lee en cada despertar desde el script
    temperature:
      id: temp_casa
      name: "Temperatura casa"
      # Si marca más que tus sensores de IKEA, descomenta y ajusta:
      # filters:
      #   - offset: -1.5
    humidity:
      id: hum_casa
      name: "Humedad casa"

  # Medidor de batería BQ27220 (mismo bus I2C que el SHT40)
  - platform: bq27220
    id: bateria
    i2c_id: bus_sensores
    update_interval: never   # se lee en cada despertar desde el script
    battery_level:
      id: bateria_pct
      name: "Batería"
    voltage:
      id: bateria_v
      name: "Voltaje batería"

  - platform: template
    id: temp_calle
    name: "Temperatura calle"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: sensacion
    name: "Sensación térmica"
    unit_of_measurement: "°C"
    update_interval: never
  - platform: template
    id: nubes
    name: "Nubosidad"
    unit_of_measurement: "%"
    update_interval: never
  - platform: template
    id: viento
    name: "Viento"
    unit_of_measurement: "km/h"
    update_interval: never
  - platform: template
    id: rachas
    name: "Rachas"
    unit_of_measurement: "km/h"
    update_interval: never
  - platform: template
    id: temp_min
    name: "Mínima hoy"
    unit_of_measurement: "°C"
    update_interval: never
  - platform: template
    id: temp_max
    name: "Máxima hoy"
    unit_of_measurement: "°C"
    update_interval: never

binary_sensor:
  # ¿Está enchufado al USB? (GPIO9 en ALTO = alimentación externa)
  - platform: gpio
    id: enchufado
    pin: GPIO9
    internal: true
  # ARRIBA: modo mantenimiento (no se duerme)
  - platform: gpio
    id: boton_arriba
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
    on_press:
      - globals.set:
          id: mantener
          value: "true"
      - deep_sleep.prevent: dormir
      - wifi.enable:
      - logger.log: "Modo mantenimiento: no me duermo"
      - component.update: pantalla
  # ABAJO: salir del modo mantenimiento y dormir
  - platform: gpio
    id: boton_abajo
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
    on_press:
      - if:
          condition:
            lambda: "return id(mantener);"
          then:
            - globals.set:
                id: mantener
                value: "false"
            - deep_sleep.allow: dormir
            - script.execute: actualizar

http_request:
  timeout: 10s

script:
  - id: actualizar
    mode: single
    then:
      - lambda: "id(br_ok) = false; id(om_n) = 0;"
      - component.update: sht40
      - component.update: bateria
      # --- Temperatura de la calle (Open-Meteo) ---
      - http_request.get:
          url: "http://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,cloud_cover,wind_speed_10m,wind_gusts_10m,weather_code,is_day&daily=temperature_2m_min,temperature_2m_max&forecast_days=1&minutely_15=precipitation&forecast_minutely_15=8&wind_speed_unit=kmh&timezone=auto"
          capture_response: true
          max_response_buffer_size: 4096
          collect_headers:
            - date
          on_response:
            then:
              # Plan B para la hora: si NTP no ha llegado, usar la cabecera
              # "Date: Sun, 22 Nov 2026 16:20:34 GMT" de la respuesta
              - lambda: |-
                  if (id(reloj).now().is_valid()) return;
                  std::string d = response->get_response_header("date");
                  int dia, anio, h, m, sg; char mes[4] = {0};
                  if (sscanf(d.c_str(), "%*3s, %d %3s %d %d:%d:%d", &dia, mes, &anio, &h, &m, &sg) != 6) {
                    ESP_LOGW("hora", "Cabecera Date no valida: '%s'", d.c_str());
                    return;
                  }
                  const char *meses = "JanFebMarAprMayJunJulAugSepOctNovDec";
                  const char *pm = strstr(meses, mes);
                  if (pm == nullptr) return;
                  int mo = (pm - meses) / 3 + 1;
                  // Días desde 1970-01-01 (algoritmo de Howard Hinnant)
                  int y = anio - (mo <= 2);
                  int era = y / 400;
                  int yoe = y - era * 400;
                  int doy = (153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5 + dia - 1;
                  int doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
                  long dias = (long) era * 146097 + doe - 719468;
                  struct timeval tv = { (time_t) (dias * 86400L + h * 3600 + m * 60 + sg), 0 };
                  settimeofday(&tv, nullptr);
                  ESP_LOGI("hora", "Hora tomada de la cabecera Date: %s", d.c_str());
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("tiempo", "Open-Meteo HTTP %d", response->status_code);
                    return;
                  }
                  json::parse_json(body, [](JsonObject root) -> bool {
                    JsonObject c = root["current"];
                    if (c.isNull() || c["temperature_2m"].isNull()) return false;
                    id(temp_calle).publish_state(c["temperature_2m"].as<float>());
                    if (!c["apparent_temperature"].isNull()) id(sensacion).publish_state(c["apparent_temperature"].as<float>());
                    if (!c["cloud_cover"].isNull())          id(nubes).publish_state(c["cloud_cover"].as<float>());
                    if (!c["wind_speed_10m"].isNull())       id(viento).publish_state(c["wind_speed_10m"].as<float>());
                    if (!c["wind_gusts_10m"].isNull())       id(rachas).publish_state(c["wind_gusts_10m"].as<float>());
                    if (!c["weather_code"].isNull())         id(codigo_tiempo) = c["weather_code"].as<int>();
                    if (!c["is_day"].isNull())               id(es_de_dia) = c["is_day"].as<int>() == 1;
                    JsonVariant mn = root["daily"]["temperature_2m_min"][0];
                    JsonVariant mx = root["daily"]["temperature_2m_max"][0];
                    if (!mn.isNull()) id(temp_min).publish_state(mn.as<float>());
                    if (!mx.isNull()) id(temp_max).publish_state(mx.as<float>());
                    // Respaldo de lluvia: mm cada 15 min -> mm/h
                    JsonArray pr = root["minutely_15"]["precipitation"];
                    const char *t0 = root["minutely_15"]["time"][0] | "";
                    int n = 0;
                    for (JsonVariant v : pr) { if (n >= 8) break; id(om_mmh)[n++] = v.as<float>() * 4.0f; }
                    id(om_n) = n;
                    if (strlen(t0) >= 16) id(om_inicio) = atoi(t0 + 11) * 60 + atoi(t0 + 14);
                    return true;
                  });
      # --- Lluvia próxima hora (Buienradar, líneas "VALOR|HH:MM" cada 5 min) ---
      - http_request.get:
          url: "https://gpsgadget.buienradar.nl/data/raintext?lat=${lat}&lon=${lon}"
          capture_response: true
          max_response_buffer_size: 1024
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("lluvia", "Buienradar HTTP %d", response->status_code);
                    return;
                  }
                  int idx = 0;
                  size_t pos = 0;
                  while (pos < body.size() && idx < 24) {   // 24 x 5 min = 2 horas
                    size_t fin = body.find('\n', pos);
                    if (fin == std::string::npos) fin = body.size();
                    std::string linea = body.substr(pos, fin - pos);
                    pos = fin + 1;
                    size_t bar = linea.find('|');
                    if (bar == std::string::npos) continue;
                    int valor = atoi(linea.substr(0, bar).c_str());
                    // Fórmula de Buienradar: mm/h = 10^((valor-109)/32); 0 = seco
                    float mmh = valor > 0 ? powf(10.0f, (valor - 109) / 32.0f) : 0.0f;
                    if (idx == 0) {
                      int hh = 0, mm = 0;
                      sscanf(linea.c_str() + bar + 1, "%d:%d", &hh, &mm);
                      id(lluvia_inicio) = hh * 60 + mm;
                    }
                    id(lluvia_mmh)[idx++] = mmh;
                  }
                  if (idx == 0) return;
                  id(lluvia_n) = idx;
                  id(br_ok) = true;
      # --- Resumen de lluvia (Buienradar o, si falló, Open-Meteo) ---
      - lambda: |-
          if (!id(br_ok)) {
            if (id(om_n) == 0) { ESP_LOGW("lluvia", "Sin datos de lluvia"); return; }
            // Cada tramo de 15 min de Open-Meteo = 3 tramos de 5 min
            int n = std::min(24, id(om_n) * 3);
            for (int i = 0; i < n; i++) id(lluvia_mmh)[i] = id(om_mmh)[i / 3];
            id(lluvia_n) = n;
            id(lluvia_inicio) = id(om_inicio);
            ESP_LOGW("lluvia", "Buienradar no respondio: uso Open-Meteo");
          }
          int primera = -1, luego = -1;
          float max_mmh = 0;
          for (int i = 0; i < id(lluvia_n); i++) {
            float mmh = id(lluvia_mmh)[i];
            if (i < 12) {                                    // la decisión: próxima hora
              if (mmh >= ${umbral_mmh} && primera < 0) primera = i;
              max_mmh = std::max(max_mmh, mmh);
            } else if (mmh >= ${umbral_mmh} && luego < 0) {
              luego = i;
            }
          }
          id(minutos_lluvia) = primera < 0 ? -1 : primera * 5;
          id(lluvia_luego) = luego < 0 ? -1 : luego * 5;
          id(lluvia_max_mmh) = max_mmh;
          if (primera >= 0) {
            int m = id(lluvia_inicio) + primera * 5;
            char hh[8];
            snprintf(hh, sizeof(hh), "%02d:%02d", (m / 60) % 24, m % 60);
            id(hora_lluvia) = hh;
          } else {
            id(hora_lluvia) = "";
          }
          id(lluvia_ok) = true;
          ESP_LOGI("lluvia", "Lluvia en %d min (%s), max %.2f mm/h",
                   id(minutos_lluvia), id(hora_lluvia).c_str(), max_mmh);
      # Esperar (máx. 15 s) a tener la hora de internet: hace falta para
      # "Updated HH:MM" y para saber si toca dormir toda la noche
      - wait_until:
          condition:
            lambda: "return id(reloj).now().is_valid();"
          timeout: 15s
      - script.execute: calcular_espera
      - script.execute: preparar_pantalla
      # Ya tenemos todo: apagar el WiFi (es lo que más gasta) mientras se pinta
      - if:
          condition:
            lambda: "return !id(mantener);"
          then:
            - wifi.disable:
      - if:
          condition:
            lambda: "return id(repintar);"
          then:
            - component.update: pantalla
            - delay: 4s         # la tinta tarda ~2,9 s en refrescar
      - script.execute: ir_a_dormir

  - id: sin_wifi
    mode: single
    then:
      - logger.log: "Sin WiFi: pinto lo que tengo y me duermo"
      - component.update: sht40
      - component.update: bateria
      - delay: 1s
      - script.execute: calcular_espera
      - script.execute: preparar_pantalla
      - if:
          condition:
            lambda: "return id(repintar);"
          then:
            - component.update: pantalla
            - delay: 4s
      - script.execute: ir_a_dormir

  # ¿Cuánto dormir? Según la hora punta, la noche y la batería
  - id: calcular_espera
    mode: single
    then:
      - lambda: |-
          const int DIA = 86400;
          int intervalo_normal = ${minutos_dia}, intervalo_punta = ${minutos_punta};
          float b = id(bateria_pct).has_state() ? id(bateria_pct).state : NAN;
          bool cargando = id(enchufado).state;
          bool ahorro = !std::isnan(b) && b < ${bateria_ahorro} && !cargando;
          id(bateria_baja) = !std::isnan(b) && b < ${bateria_aviso} && !cargando;
          id(noche) = false;
          auto t = id(reloj).now();
          if (!t.is_valid()) {
            id(espera_ms) = (uint32_t) (ahorro ? 30 : intervalo_normal) * 60 * 1000;
            return;
          }
          int ahora = t.hour * 3600 + t.minute * 60 + t.second;
          const int franjas[][2] = { {${punta1}}, {${punta2}} };   // en minutos
          bool en_punta = false;
          for (auto &fr : franjas)
            if (ahora >= fr[0] * 60 && ahora < fr[1] * 60) en_punta = true;
          int intervalo = en_punta ? intervalo_punta : intervalo_normal;
          if (ahorro) intervalo = std::max(intervalo, 30);
          int siguiente = ahora + intervalo * 60;
          // No perderse el comienzo de una hora punta: despertar justo al empezar
          if (!ahorro)
            for (auto &fr : franjas)
              if (ahora < fr[0] * 60 && siguiente > fr[0] * 60) siguiente = fr[0] * 60;
          int inicio = ${hora_dormir} * 3600, fin = ${hora_despertar} * 3600;
          auto de_noche = [&](int s) {
            return inicio < fin ? (s >= inicio && s < fin) : (s >= inicio || s < fin);
          };
          if (de_noche(ahora) || de_noche(siguiente % DIA)) {
            id(espera_ms) = (uint32_t) ((fin - ahora + DIA) % DIA) * 1000;
            id(noche) = true;
          } else {
            id(espera_ms) = (uint32_t) (siguiente - ahora) * 1000;
          }
          ESP_LOGI("dormir", "Proxima actualizacion en %u min%s%s", (unsigned) (id(espera_ms) / 60000),
                   en_punta ? " (hora punta)" : "", ahorro ? " (ahorro de bateria)" : "");

  # Tendencias (última hora) y decidir si hace falta repintar
  - id: preparar_pantalla
    mode: single
    then:
      - lambda: |-
          auto &e = estado_rtc();
          bool hora_ok = id(reloj).now().is_valid();
          time_t ahora = ::time(nullptr);
          float tc = id(temp_casa).has_state() ? id(temp_casa).state : NAN;
          float tf = id(temp_calle).has_state() ? id(temp_calle).state : NAN;
          auto tendencia = [](float v, float ref) -> int {
            if (std::isnan(v) || std::isnan(ref)) return 0;
            float d = v - ref;
            return d >= 0.3f ? 1 : d <= -0.3f ? -1 : 0;
          };
          if (hora_ok) {
            if (e.ref_t == 0 || ahora < e.ref_t || ahora - e.ref_t > 3 * 3600) {
              // Sin referencia o demasiado vieja (p. ej. tras la noche): empezar de nuevo
              e.ref_casa = tc; e.ref_calle = tf; e.ref_t = ahora;
              e.tend_casa = 0; e.tend_calle = 0;
            } else if (ahora - e.ref_t >= 58 * 60) {
              // Ha pasado ~1 hora: calcular la tendencia y renovar la referencia
              e.tend_casa = tendencia(tc, e.ref_casa);
              e.tend_calle = tendencia(tf, e.ref_calle);
              e.ref_casa = tc; e.ref_calle = tf; e.ref_t = ahora;
            }
          }
          id(tend_casa) = e.tend_casa;
          id(tend_calle) = e.tend_calle;

          // Firma de todo lo que se ve en pantalla (menos la hora)
          char f[200];
          float b = id(bateria_pct).has_state() ? id(bateria_pct).state : -1;
          snprintf(f, sizeof(f), "%.1f|%.0f|%.1f|%.0f|%.0f|%d|%d|%.0f|%.0f|%.0f|%d|%d|%.1f|%s|%d|%d|%d|%d|%d|%d|%d|%d|",
                   tc, id(hum_casa).state, tf, id(sensacion).state, id(nubes).state / 10.0f,
                   id(codigo_tiempo), (int) id(es_de_dia), id(viento).state,
                   id(temp_min).state, id(temp_max).state, id(minutos_lluvia), id(lluvia_luego),
                   id(lluvia_max_mmh), id(hora_lluvia).c_str(), (int) (b / 10), (int) id(enchufado).state,
                   (int) id(mantener), (int) id(noche), (int) id(bateria_baja), (int) id(lluvia_ok),
                   id(tend_casa), id(tend_calle));
          std::string firma = f;
          for (int i = 0; i < id(lluvia_n); i++)      // alturas de las barras
            firma += (char) ('A' + (int) (20 * std::min(1.0f, sqrtf(id(lluvia_mmh)[i] / 5.0f))));
          uint32_t h = fnv1a(firma);
          bool viejo = !hora_ok || e.pintado_t == 0 || ahora - e.pintado_t >= 55 * 60;
          id(repintar) = id(mantener) || viejo || h != e.firma;
          if (id(repintar)) {
            e.firma = h;
            if (hora_ok) e.pintado_t = ahora;
          }
          ESP_LOGI("pantalla", "%s", id(repintar) ? "Repinto" : "Nada ha cambiado: no repinto");

  - id: ir_a_dormir
    mode: single
    then:
      - if:
          condition:
            lambda: "return id(mantener);"
          then:
            - logger.log: "Modo mantenimiento activo: sigo despierto"
          else:
            # Congelar los pines durante el sueño: alimentación encendida,
            # periféricos (táctil, micro, SD, zumbador) apagados, botón con pull-up.
            - lambda: |-
                auto fijar = [](int pin, int nivel) {
                  gpio_num_t p = (gpio_num_t) pin;
                  gpio_hold_dis(p);
                  gpio_set_direction(p, GPIO_MODE_OUTPUT);
                  gpio_set_level(p, nivel);
                  gpio_hold_en(p);
                };
                fijar(45, 1); fijar(46, 1);                 // mantener alimentación
                fijar(47, 0);                               // tinta sin alimentación (conserva la imagen)
                fijar(42, 0); fijar(41, 0);                 // táctil apagado
                fijar(38, 0);                               // micrófono apagado
                fijar(10, 0);                               // microSD apagada
                fijar(48, 0);                               // zumbador apagado
                gpio_num_t b = GPIO_NUM_4;                  // botón AI/OK para despertar
                gpio_hold_dis(b);
                gpio_set_direction(b, GPIO_MODE_INPUT);
                gpio_pullup_en(b);
                gpio_hold_en(b);
                gpio_deep_sleep_hold_en();
            - deep_sleep.enter:
                id: dormir
                sleep_duration: !lambda "return id(espera_ms);"

