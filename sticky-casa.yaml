display:
  - platform: epaper_spi
    id: pantalla
    model: Seeed-reTerminal-Sticky
    update_interval: never          # se actualiza desde el script en cada despertar
    lambda: |-
      auto N = Color::BLACK;
      auto B = Color::WHITE;
      // Todo en negro (probamos grises y se distinguían poco en la tinta)
      auto GO = Color::BLACK;
      auto GC = Color::BLACK;
      int bx, by, w, h;   // para medir textos

      // ===== Ayudantes de dibujo =====
      // Rectángulo con esquinas redondeadas (relleno)
      auto rr = [&](int x, int y, int w, int h, int r, Color c) {
        it.filled_rectangle(x + r, y, w - 2 * r, h, c);
        it.filled_rectangle(x, y + r, w, h - 2 * r, c);
        it.filled_circle(x + r, y + r, r, c);
        it.filled_circle(x + w - r - 1, y + r, r, c);
        it.filled_circle(x + r, y + h - r - 1, r, c);
        it.filled_circle(x + w - r - 1, y + h - r - 1, r, c);
      };
      // Recuadro con borde (grosor 3)
      auto caja = [&](int x, int y, int w, int h, int r, Color borde = Color::BLACK) {
        rr(x, y, w, h, r, borde);
        rr(x + 3, y + 3, w - 6, h - 6, r - 3, B);
      };
      auto ancho = [&](const char *s, esphome::font::Font *f) {
        it.get_text_bounds(0, 0, s, f, TextAlign::TOP_LEFT, &bx, &by, &w, &h);
        return w;
      };
      // Icono + texto, centrados juntos en (cx, cy)
      auto icono_texto = [&](int cx, int cy, esphome::font::Font *fi, const char *ico,
                             esphome::font::Font *ft, const char *txt, Color c, Color ci) {
        int wi = ancho(ico, fi), wt = ancho(txt, ft), hueco = 10;
        int x = cx - (wi + hueco + wt) / 2;
        it.print(x, cy, fi, ci, TextAlign::CENTER_LEFT, ico);
        it.print(x + wi + hueco, cy, ft, c, TextAlign::CENTER_LEFT, txt);
      };
      // Tarjeta con cabecera negra: icono + título en blanco
      auto tarjeta = [&](int x, int y, int w, int h, const char *ico, const char *titulo) {
        rr(x, y, w, h, 14, N);
        rr(x + 3, y + 42, w - 6, h - 45, 11, B);
        it.filled_rectangle(x + 3, y + 42, w - 6, 12, B);   // unión recta bajo la cabecera
        it.print(x + 14, y + 22, id(i_titulo), B, TextAlign::CENTER_LEFT, ico);
        it.print(x + 50, y + 22, id(f_titulo), B, TextAlign::CENTER_LEFT, titulo);
      };
      // Temperatura con formato:  21  grande, ".4" pequeño abajo y "°C" arriba
      auto temperatura = [&](int cx, int base, sensor::Sensor *s, int tend) {
        if (!s->has_state() || std::isnan(s->state)) {
          it.print(cx, base, id(f_grande), N, TextAlign::BASELINE_CENTER, "--");
          return;
        }
        char buf[12];
        snprintf(buf, sizeof(buf), "%.1f", s->state);
        char *punto = strchr(buf, '.');
        std::string entero = punto ? std::string(buf, punto - buf) : std::string(buf);
        std::string decimal = punto ? std::string(punto) : "";
        int w1 = ancho(entero.c_str(), id(f_grande));
        int w2 = std::max(ancho(decimal.c_str(), id(f_decimal)), ancho("°C", id(f_unidad)));
        int x = cx - (w1 + 6 + w2) / 2;
        it.print(x, base, id(f_grande), N, TextAlign::BASELINE_LEFT, entero.c_str());
        it.print(x + w1 + 6, base, id(f_decimal), N, TextAlign::BASELINE_LEFT, decimal.c_str());
        it.print(x + w1 + 8, base - 72, id(f_unidad), GO, TextAlign::TOP_LEFT, "°C");
        // Flecha de tendencia (última hora) junto a °C
        if (tend != 0)
          it.print(x + w1 + 8 + ancho("°C", id(f_unidad)) + 6, base - 68, id(i_peque), N,
                   TextAlign::TOP_LEFT, tend > 0 ? "\U000F0535" : "\U000F0533");
      };

      bool va_a_llover = id(lluvia_ok) && id(minutos_lluvia) >= 0;

      // Estado del cielo: icono + texto
      const char *ico_cielo = "\U000F0595";
      const char *txt_cielo = "--";
      if (id(nubes).has_state()) {
        int cod = id(codigo_tiempo);
        float n = id(nubes).state;
        bool dia = id(es_de_dia);
        if (cod == 45 || cod == 48)                          { ico_cielo = "\U000F0591"; txt_cielo = "Foggy"; }
        else if ((cod >= 71 && cod <= 77) || cod == 85 || cod == 86) { ico_cielo = "\U000F0598"; txt_cielo = "Snow"; }
        else if (n < 20)  { ico_cielo = dia ? "\U000F0599" : "\U000F0594"; txt_cielo = "Clear sky"; }
        else if (n < 60)  { ico_cielo = dia ? "\U000F0595" : "\U000F0F31"; txt_cielo = "Partly cloudy"; }
        else if (n < 90)  { ico_cielo = "\U000F0590"; txt_cielo = "Cloudy"; }
        else              { ico_cielo = "\U000F0590"; txt_cielo = "Overcast"; }
      }
      // Viento: palabra + km/h
      char txt_viento[32] = "--";
      if (id(viento).has_state()) {
        float v = id(viento).state;
        const char *pal = v < 6 ? "Calm" : v < 20 ? "Breezy" : v < 39 ? "Windy" : v < 62 ? "Very windy" : "Storm";
        snprintf(txt_viento, sizeof(txt_viento), "%s %.0f km/h", pal, v);
      }

      // ---------- HOME ----------
      tarjeta(10, 10, 250, 235, "\U000F0F54", "HOME");
      temperatura(135, 160, id(temp_casa), id(tend_casa));
      if (id(hum_casa).has_state()) {
        char hum[16];
        snprintf(hum, sizeof(hum), "%.0f%%", id(hum_casa).state);
        icono_texto(135, 210, id(i_medio), "\U000F058E", id(f_medio), hum, N, GO);
      }

      // ---------- OUTSIDE ----------
      tarjeta(270, 10, 520, 235, va_a_llover ? "\U000F0597" : ico_cielo, "OUTSIDE");
      // Izquierda: temperatura y sensación térmica (alineadas con HOME)
      temperatura(395, 160, id(temp_calle), id(tend_calle));
      if (id(sensacion).has_state())
        it.printf(395, 210, id(f_medio), GO, TextAlign::CENTER, "Feels like %.0f°", id(sensacion).state);
      // Separador
      it.filled_rectangle(520, 66, 2, 160, GC);
      // Derecha: cielo, viento y mínima/máxima de hoy
      {
        const int xi = 534, xt = 572;
        const int fila[3] = {88, 142, 196};
        it.print(xi, fila[0], id(i_lista), GO, TextAlign::CENTER_LEFT, ico_cielo);
        it.print(xt, fila[0], id(f_lista), N, TextAlign::CENTER_LEFT, txt_cielo);
        it.print(xi, fila[1], id(i_lista), GO, TextAlign::CENTER_LEFT, "\U000F059D");
        it.print(xt, fila[1], id(f_lista), N, TextAlign::CENTER_LEFT, txt_viento);
        it.print(xi, fila[2], id(i_lista), GO, TextAlign::CENTER_LEFT, "\U000F050F");
        int x = xt;
        char v[12];
        it.print(x, fila[2], id(i_peque), GO, TextAlign::CENTER_LEFT, "\U000F0045");
        x += ancho("\U000F0045", id(i_peque)) + 2;
        if (id(temp_min).has_state()) snprintf(v, sizeof(v), "%.0f°", id(temp_min).state); else strcpy(v, "--");
        it.print(x, fila[2], id(f_lista), N, TextAlign::CENTER_LEFT, v);
        x += ancho(v, id(f_lista)) + 18;
        it.print(x, fila[2], id(i_peque), GO, TextAlign::CENTER_LEFT, "\U000F005D");
        x += ancho("\U000F005D", id(i_peque)) + 2;
        if (id(temp_max).has_state()) snprintf(v, sizeof(v), "%.0f°", id(temp_max).state); else strcpy(v, "--");
        it.print(x, fila[2], id(f_lista), N, TextAlign::CENTER_LEFT, v);
      }

      // ---------- RAIN: aviso + gráfica de Buienradar (próximas 2 h) ----------
      {
        const int X = 10, Y = 255, W = 780, H = 170;
        Color tinta = va_a_llover ? B : N;    // texto blanco sobre negro si llueve
        Color suave = tinta;                  // detalles
        if (va_a_llover) rr(X, Y, W, H, 14, N); else caja(X, Y, W, H, 14);

        if (!id(lluvia_ok)) {
          it.print(400, Y + H / 2, id(f_medio), N, TextAlign::CENTER, "No rain data (check Wi-Fi)");
        } else {
          // Fila 1: icono + mensaje a la izquierda, detalle a la derecha
          const int fy = Y + 32;
          int wi = ancho(va_a_llover ? "\U000F054A" : "\U000F09B0", id(i_grande));
          it.print(X + 20, fy, id(i_grande), tinta, TextAlign::CENTER_LEFT,
                   va_a_llover ? "\U000F054A" : "\U000F09B0");
          it.print(X + 30 + wi, fy, id(f_aviso), tinta, TextAlign::CENTER_LEFT,
                   va_a_llover ? "TAKE AN UMBRELLA!" : "No umbrella needed");
          char det[48];
          if (va_a_llover && id(minutos_lluvia) == 0)
            snprintf(det, sizeof(det), "Raining now · max %.1f mm/h", id(lluvia_max_mmh));
          else if (va_a_llover)
            snprintf(det, sizeof(det), "From %s · max %.1f mm/h", id(hora_lluvia).c_str(), id(lluvia_max_mmh));
          else if (id(lluvia_luego) >= 0) {
            int m = id(lluvia_inicio) + id(lluvia_luego);
            float mx2 = 0;
            for (int i = 12; i < id(lluvia_n) && i < 24; i++) mx2 = std::max(mx2, id(lluvia_mmh)[i]);
            const char *tipo = mx2 < 1.0f ? "Light rain" : mx2 < 4.0f ? "Rain" : "Heavy rain";
            snprintf(det, sizeof(det), "%s ~%02d:%02d", tipo, (m / 60) % 24, m % 60);
          } else
            snprintf(det, sizeof(det), "Dry for 2 hours");
          it.print(X + W - 20, fy, id(f_lista), suave, TextAlign::CENTER_RIGHT, det);

          // Gráfica: 24 barras de 5 min. Escala raíz cuadrada para que la
          // llovizna se vea y un chaparrón no se salga (tope 5 mm/h).
          const int gx = X + 20, gw = W - 40, base = Y + 132, galto = 62;
          int n = std::max(1, id(lluvia_n));
          float paso = (float) gw / 24;
          for (int i = 0; i < n && i < 24; i++) {
            float mmh = id(lluvia_mmh)[i];
            int hb = (int) (galto * std::min(1.0f, sqrtf(mmh / 5.0f)));
            if (mmh > 0 && hb < 3) hb = 3;
            int bx0 = gx + (int) (i * paso) + 2, bw = (int) paso - 4;
            // Próxima hora (la que decide el paraguas): barras rellenas.
            // Segunda hora: barras huecas (solo contorno).
            if (hb > 0) {
              if (i < 12) it.filled_rectangle(bx0, base - hb, bw, hb, tinta);
              else {
                it.rectangle(bx0, base - hb, bw, hb, tinta);
                if (bw > 4 && hb > 4) it.rectangle(bx0 + 1, base - hb + 1, bw - 2, hb - 2, tinta);
              }
            }
          }
          it.filled_rectangle(gx, base, gw, 2, suave);                  // eje
          // Horas debajo: cada 30 min
          for (int k = 0; k <= 4; k++) {
            int m = id(lluvia_inicio) + k * 30;
            char et[8];
            if (k == 0) strcpy(et, "now");
            else snprintf(et, sizeof(et), "%02d:%02d", (m / 60) % 24, m % 60);
            int ex = gx + (int) (k * 6 * paso);
            TextAlign al = k == 0 ? TextAlign::TOP_LEFT : k == 4 ? TextAlign::TOP_RIGHT : TextAlign::TOP_CENTER;
            it.print(k == 4 ? gx + gw : ex, base + 5, id(f_peque), suave, al, et);
          }
        }
      }

      // ---------- LEYENDA de botones (pequeña, en gris) ----------
      const int y0 = 435, alto = 38, cy = y0 + alto / 2;
      auto leyenda = [&](bool dibujar) -> int {
        int x = 22;
        auto texto = [&](const char *s) {
          if (dibujar) it.print(x, cy, id(f_ley), GO, TextAlign::CENTER_LEFT, s);
          x += ancho(s, id(f_ley));
        };
        auto triangulo = [&](bool arriba) {   // Roboto no trae flechas: las dibujamos
          if (dibujar) {
            if (arriba) it.filled_triangle(x, cy + 5, x + 11, cy + 5, x + 5, cy - 6, GO);
            else        it.filled_triangle(x, cy - 5, x + 11, cy - 5, x + 5, cy + 6, GO);
          }
          x += 16;
        };
        if (id(mantener)) {
          texto("MAINTENANCE  ·  ");
          triangulo(false);
          texto("exit and sleep");
        } else {
          if (dibujar) {
            rr(x, cy - 10, 26, 20, 4, GO);   // "AI" en negativo, como el botón
            it.print(x + 13, cy, id(f_ley), B, TextAlign::CENTER, "AI");
          }
          x += 32;
          texto("refresh");
          x += 16;
          triangulo(true);
          texto("maintenance");
          x += 16;
          triangulo(false);
          texto("sleep");
        }
        return x;
      };
      if (id(bateria_baja) && !id(mantener)) {
        // Batería baja: aviso bien visible (negro) en lugar de la leyenda
        const char *msg = "Battery low · please charge";
        int wi = ancho("\U000F10CD", id(i_peque)), wt = ancho(msg, id(f_peque));
        rr(10, y0, wi + 8 + wt + 28, alto, 10, N);
        it.print(24, cy, id(i_peque), B, TextAlign::CENTER_LEFT, "\U000F10CD");
        it.print(24 + wi + 8, cy, id(f_peque), B, TextAlign::CENTER_LEFT, msg);
      } else {
        int fin = leyenda(false);
        caja(10, y0, fin - 10 + 12, alto, 10, GC);
        leyenda(true);
      }

      // ---------- BATERÍA + HORA (recuadrito abajo a la derecha) ----------
      {
        char pie[48] = "";
        auto t = id(reloj).now();
        bool toda_noche = id(noche);   // va a dormir toda la noche
        if (t.is_valid()) {
          if (toda_noche)
            snprintf(pie, sizeof(pie), "%02d:%02d · next %02d:00", t.hour, t.minute, ${hora_despertar});
          else
            snprintf(pie, sizeof(pie), "%02d:%02d", t.hour, t.minute);
        }
        const char *ico_hora = toda_noche ? "\U000F0594" : "\U000F0150";   // luna / reloj
        // Batería: icono según el nivel, o rayo si está cargando
        char bat[8] = "";
        const char *ico_bat = nullptr;
        if (id(bateria_pct).has_state() && !std::isnan(id(bateria_pct).state)) {
          float b = id(bateria_pct).state;
          snprintf(bat, sizeof(bat), "%.0f%%", b);
          if (id(enchufado).state) ico_bat = "\U000F0084";
          else ico_bat = b >= 90 ? "\U000F0079" : b >= 70 ? "\U000F0081" : b >= 50 ? "\U000F007F"
                       : b >= 30 ? "\U000F007D" : b >= 15 ? "\U000F007B" : "\U000F008E";
        }
        int w_bat = ico_bat ? ancho(ico_bat, id(i_peque)) + 4 + ancho(bat, id(f_peque)) + 16 : 0;
        int w_hora = pie[0] ? ancho(ico_hora, id(i_peque)) + 8 + ancho(pie, id(f_peque)) : 0;
        int cw = w_bat + w_hora + 28;
        if (cw > 28) {
          int x = 790 - cw;
          caja(x, y0, cw, alto, 10, GC);
          x += 14;
          if (ico_bat) {
            it.print(x, cy, id(i_peque), GO, TextAlign::CENTER_LEFT, ico_bat);
            x += ancho(ico_bat, id(i_peque)) + 4;
            it.print(x, cy, id(f_peque), GO, TextAlign::CENTER_LEFT, bat);
            x += ancho(bat, id(f_peque)) + 16;
          }
          if (pie[0]) {
            it.print(x, cy, id(i_peque), GO, TextAlign::CENTER_LEFT, ico_hora);
            x += ancho(ico_hora, id(i_peque)) + 8;
            it.print(x, cy, id(f_peque), GO, TextAlign::CENTER_LEFT, pie);
          }
        }
      }
