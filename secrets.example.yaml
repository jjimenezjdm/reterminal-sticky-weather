# Copy this file to secrets.yaml and fill in your own values.
# secrets.yaml is in .gitignore — never commit it.

wifi_ssid: "YOUR_WIFI_NAME"          # 2.4 GHz network
wifi_password: "YOUR_WIFI_PASSWORD"

# OTA password: any random string, e.g. `openssl rand -hex 12`
ota_password: "CHANGE_ME"

# Your location (used for Open-Meteo and Buienradar) and timezone.
# Buienradar only covers the Netherlands and Belgium.
latitude: "52.09"                    # example: Utrecht
longitude: "5.12"
timezone: "Europe/Amsterdam"         # IANA timezone name
