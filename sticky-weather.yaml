display:
  - platform: epaper_spi
    id: epaper
    model: Seeed-reTerminal-Sticky
    update_interval: never          # redrawn from the script on each wake-up
    lambda: |-
      auto INK = Color::BLACK;
      auto PAPER = Color::WHITE;
      int bx, by, w, h;   // for measuring text

      // ===== Drawing helpers =====
      // Filled rectangle with rounded corners
      auto rrect = [&](int x, int y, int w, int h, int r, Color c) {
        it.filled_rectangle(x + r, y, w - 2 * r, h, c);
        it.filled_rectangle(x, y + r, w, h - 2 * r, c);
        it.filled_circle(x + r, y + r, r, c);
        it.filled_circle(x + w - r - 1, y + r, r, c);
        it.filled_circle(x + r, y + h - r - 1, r, c);
        it.filled_circle(x + w - r - 1, y + h - r - 1, r, c);
      };
      // Outlined box (3 px border)
      auto box = [&](int x, int y, int w, int h, int r) {
        rrect(x, y, w, h, r, INK);
        rrect(x + 3, y + 3, w - 6, h - 6, r - 3, PAPER);
      };
      auto text_width = [&](const char *s, esphome::font::Font *f) {
        it.get_text_bounds(0, 0, s, f, TextAlign::TOP_LEFT, &bx, &by, &w, &h);
        return w;
      };
      // Icon + text, centered together at (cx, cy)
      auto icon_text = [&](int cx, int cy, esphome::font::Font *fi, const char *icon,
                           esphome::font::Font *ft, const char *txt) {
        int wi = text_width(icon, fi), wt = text_width(txt, ft), gap = 10;
        int x = cx - (wi + gap + wt) / 2;
        it.print(x, cy, fi, INK, TextAlign::CENTER_LEFT, icon);
        it.print(x + wi + gap, cy, ft, INK, TextAlign::CENTER_LEFT, txt);
      };
      // Card with a black header: white icon + title
      auto card = [&](int x, int y, int w, int h, const char *icon, const char *title) {
        rrect(x, y, w, h, 14, INK);
        rrect(x + 3, y + 42, w - 6, h - 45, 11, PAPER);
        it.filled_rectangle(x + 3, y + 42, w - 6, 12, PAPER);   // straight join under the header
        it.print(x + 14, y + 22, id(i_title), PAPER, TextAlign::CENTER_LEFT, icon);
        it.print(x + 50, y + 22, id(f_title), PAPER, TextAlign::CENTER_LEFT, title);
      };
      // Formatted temperature: big "21", small ".4" below and "°C" above
      auto temperature = [&](int cx, int base, sensor::Sensor *s, int trend) {
        if (!s->has_state() || std::isnan(s->state)) {
          it.print(cx, base, id(f_big), INK, TextAlign::BASELINE_CENTER, "--");
          return;
        }
        char buf[12];
        snprintf(buf, sizeof(buf), "%.1f", s->state);
        char *dot = strchr(buf, '.');
        std::string integer = dot ? std::string(buf, dot - buf) : std::string(buf);
        std::string decimal = dot ? std::string(dot) : "";
        int w1 = text_width(integer.c_str(), id(f_big));
        int w2 = std::max(text_width(decimal.c_str(), id(f_decimal)), text_width("°C", id(f_unit)));
        int x = cx - (w1 + 6 + w2) / 2;
        it.print(x, base, id(f_big), INK, TextAlign::BASELINE_LEFT, integer.c_str());
        it.print(x + w1 + 6, base, id(f_decimal), INK, TextAlign::BASELINE_LEFT, decimal.c_str());
        it.print(x + w1 + 8, base - 72, id(f_unit), INK, TextAlign::TOP_LEFT, "°C");
        // Trend arrow (last hour) next to °C
        if (trend != 0)
          it.print(x + w1 + 8 + text_width("°C", id(f_unit)) + 6, base - 68, id(i_small), INK,
                   TextAlign::TOP_LEFT, trend > 0 ? "\U000F0535" : "\U000F0533");
      };

      bool rain_soon = id(rain_ok) && id(rain_in_min) >= 0;

      // Sky: icon + text
      const char *sky_icon = "\U000F0595";
      const char *sky_text = "--";
      if (id(cloud_cover).has_state()) {
        int code = id(weather_code);
        float n = id(cloud_cover).state;
        bool day = id(is_daytime);
        if (code == 45 || code == 48)                            { sky_icon = "\U000F0591"; sky_text = "Foggy"; }
        else if ((code >= 71 && code <= 77) || code == 85 || code == 86) { sky_icon = "\U000F0598"; sky_text = "Snow"; }
        else if (n < 20)  { sky_icon = day ? "\U000F0599" : "\U000F0594"; sky_text = "Clear sky"; }
        else if (n < 60)  { sky_icon = day ? "\U000F0595" : "\U000F0F31"; sky_text = "Partly cloudy"; }
        else if (n < 90)  { sky_icon = "\U000F0590"; sky_text = "Cloudy"; }
        else              { sky_icon = "\U000F0590"; sky_text = "Overcast"; }
      }
      // Wind: word + km/h
      char wind_text[32] = "--";
      if (id(wind_speed).has_state()) {
        float v = id(wind_speed).state;
        const char *word = v < 6 ? "Calm" : v < 20 ? "Breezy" : v < 39 ? "Windy" : v < 62 ? "Very windy" : "Storm";
        snprintf(wind_text, sizeof(wind_text), "%s %.0f km/h", word, v);
      }

      // ---------- HOME ----------
      card(10, 10, 250, 235, "\U000F0F54", "HOME");
      temperature(135, 160, id(indoor_temp), id(trend_indoor));
      if (id(indoor_humidity).has_state()) {
        char hum[16];
        snprintf(hum, sizeof(hum), "%.0f%%", id(indoor_humidity).state);
        icon_text(135, 210, id(i_medium), "\U000F058E", id(f_medium), hum);
      }

      // ---------- OUTSIDE ----------
      card(270, 10, 520, 235, rain_soon ? "\U000F0597" : sky_icon, "OUTSIDE");
      // Left: temperature and feels-like (aligned with HOME)
      temperature(395, 160, id(outdoor_temp), id(trend_outdoor));
      if (id(feels_like).has_state())
        it.printf(395, 210, id(f_medium), INK, TextAlign::CENTER, "Feels like %.0f°", id(feels_like).state);
      // Divider
      it.filled_rectangle(520, 66, 2, 160, INK);
      // Right: sky, wind and today's min/max
      {
        const int xi = 534, xt = 572;
        const int row[3] = {88, 142, 196};
        it.print(xi, row[0], id(i_list), INK, TextAlign::CENTER_LEFT, sky_icon);
        it.print(xt, row[0], id(f_list), INK, TextAlign::CENTER_LEFT, sky_text);
        it.print(xi, row[1], id(i_list), INK, TextAlign::CENTER_LEFT, "\U000F059D");
        it.print(xt, row[1], id(f_list), INK, TextAlign::CENTER_LEFT, wind_text);
        it.print(xi, row[2], id(i_list), INK, TextAlign::CENTER_LEFT, "\U000F050F");
        int x = xt;
        char v[12];
        it.print(x, row[2], id(i_small), INK, TextAlign::CENTER_LEFT, "\U000F0045");
        x += text_width("\U000F0045", id(i_small)) + 2;
        if (id(today_min).has_state()) snprintf(v, sizeof(v), "%.0f°", id(today_min).state); else strcpy(v, "--");
        it.print(x, row[2], id(f_list), INK, TextAlign::CENTER_LEFT, v);
        x += text_width(v, id(f_list)) + 18;
        it.print(x, row[2], id(i_small), INK, TextAlign::CENTER_LEFT, "\U000F005D");
        x += text_width("\U000F005D", id(i_small)) + 2;
        if (id(today_max).has_state()) snprintf(v, sizeof(v), "%.0f°", id(today_max).state); else strcpy(v, "--");
        it.print(x, row[2], id(f_list), INK, TextAlign::CENTER_LEFT, v);
      }

      // ---------- RAIN: umbrella advice + 2-hour chart ----------
      {
        const int X = 10, Y = 255, W = 780, H = 170;
        Color fg = rain_soon ? PAPER : INK;   // white on black when rain is coming
        if (rain_soon) rrect(X, Y, W, H, 14, INK); else box(X, Y, W, H, 14);

        if (!id(rain_ok)) {
          it.print(400, Y + H / 2, id(f_medium), INK, TextAlign::CENTER, "No rain data (check Wi-Fi)");
        } else {
          // Row 1: icon + message on the left, details on the right
          const int fy = Y + 32;
          const char *umbrella = rain_soon ? "\U000F054A" : "\U000F09B0";
          int wi = text_width(umbrella, id(i_large));
          it.print(X + 20, fy, id(i_large), fg, TextAlign::CENTER_LEFT, umbrella);
          it.print(X + 30 + wi, fy, id(f_alert), fg, TextAlign::CENTER_LEFT,
                   rain_soon ? "TAKE AN UMBRELLA!" : "No umbrella needed");
          char detail[48];
          if (rain_soon && id(rain_in_min) == 0)
            snprintf(detail, sizeof(detail), "Raining now · max %.1f mm/h", id(rain_max_mmh));
          else if (rain_soon)
            snprintf(detail, sizeof(detail), "From %s · max %.1f mm/h", id(rain_start_time).c_str(), id(rain_max_mmh));
          else if (id(rain_later_min) >= 0) {
            int m = id(rain_first_slot_min) + id(rain_later_min);
            float max2 = 0;
            for (int i = 12; i < id(rain_n) && i < 24; i++) max2 = std::max(max2, id(rain_mmh)[i]);
            const char *kind = max2 < 1.0f ? "Light rain" : max2 < 4.0f ? "Rain" : "Heavy rain";
            snprintf(detail, sizeof(detail), "%s ~%02d:%02d", kind, (m / 60) % 24, m % 60);
          } else
            snprintf(detail, sizeof(detail), "Dry for 2 hours");
          it.print(X + W - 20, fy, id(f_list), fg, TextAlign::CENTER_RIGHT, detail);

          // Chart: 24 bars of 5 min. Square-root scale so drizzle is visible
          // and a downpour doesn't overflow (capped at 5 mm/h).
          const int gx = X + 20, gw = W - 40, base = Y + 132, gh = 62;
          int n = std::max(1, id(rain_n));
          float step = (float) gw / 24;
          for (int i = 0; i < n && i < 24; i++) {
            float mmh = id(rain_mmh)[i];
            int hb = (int) (gh * std::min(1.0f, sqrtf(mmh / 5.0f)));
            if (mmh > 0 && hb < 3) hb = 3;
            int bx0 = gx + (int) (i * step) + 2, bw = (int) step - 4;
            // Next hour (decides the umbrella): filled bars.
            // Second hour: hollow bars (outline only).
            if (hb > 0) {
              if (i < 12) it.filled_rectangle(bx0, base - hb, bw, hb, fg);
              else {
                it.rectangle(bx0, base - hb, bw, hb, fg);
                if (bw > 4 && hb > 4) it.rectangle(bx0 + 1, base - hb + 1, bw - 2, hb - 2, fg);
              }
            }
          }
          it.filled_rectangle(gx, base, gw, 2, fg);                  // axis
          // Time labels every 30 min
          for (int k = 0; k <= 4; k++) {
            int m = id(rain_first_slot_min) + k * 30;
            char label[8];
            if (k == 0) strcpy(label, "now");
            else snprintf(label, sizeof(label), "%02d:%02d", (m / 60) % 24, m % 60);
            int lx = gx + (int) (k * 6 * step);
            TextAlign al = k == 0 ? TextAlign::TOP_LEFT : k == 4 ? TextAlign::TOP_RIGHT : TextAlign::TOP_CENTER;
            it.print(k == 4 ? gx + gw : lx, base + 5, id(f_small), fg, al, label);
          }
        }
      }

      // ---------- Button LEGEND (small, bottom left) ----------
      const int y0 = 435, bar_h = 38, cy = y0 + bar_h / 2;
      auto legend = [&](bool draw) -> int {
        int x = 22;
        auto text = [&](const char *s) {
          if (draw) it.print(x, cy, id(f_legend), INK, TextAlign::CENTER_LEFT, s);
          x += text_width(s, id(f_legend));
        };
        auto triangle = [&](bool up) {   // Roboto has no arrows: draw them
          if (draw) {
            if (up) it.filled_triangle(x, cy + 5, x + 11, cy + 5, x + 5, cy - 6, INK);
            else    it.filled_triangle(x, cy - 5, x + 11, cy - 5, x + 5, cy + 6, INK);
          }
          x += 16;
        };
        if (id(maintenance)) {
          text("MAINTENANCE  ·  ");
          triangle(false);
          text("exit and sleep");
        } else {
          if (draw) {
            rrect(x, cy - 10, 26, 20, 4, INK);   // "AI" inverted, like the button
            it.print(x + 13, cy, id(f_legend), PAPER, TextAlign::CENTER, "AI");
          }
          x += 32;
          text("refresh");
          x += 16;
          triangle(true);
          text("maintenance");
          x += 16;
          triangle(false);
          text("sleep");
        }
        return x;
      };
      if (id(battery_low) && !id(maintenance)) {
        // Low battery: a clearly visible (black) warning instead of the legend
        const char *msg = "Battery low · please charge";
        int wi = text_width("\U000F10CD", id(i_small)), wt = text_width(msg, id(f_small));
        rrect(10, y0, wi + 8 + wt + 28, bar_h, 10, INK);
        it.print(24, cy, id(i_small), PAPER, TextAlign::CENTER_LEFT, "\U000F10CD");
        it.print(24 + wi + 8, cy, id(f_small), PAPER, TextAlign::CENTER_LEFT, msg);
      } else {
        int end = legend(false);
        box(10, y0, end - 10 + 12, bar_h, 10);
        legend(true);
      }

      // ---------- BATTERY + TIME (bottom right) ----------
      {
        char footer[48] = "";
        auto t = id(sntp_time).now();
        bool whole_night = id(night_sleep);   // will sleep through the night
        if (t.is_valid()) {
          if (whole_night)
            snprintf(footer, sizeof(footer), "%02d:%02d · next %02d:00", t.hour, t.minute, ${night_end_hour});
          else
            snprintf(footer, sizeof(footer), "%02d:%02d", t.hour, t.minute);
        }
        const char *clock_icon = whole_night ? "\U000F0594" : "\U000F0150";   // moon / clock
        // Battery: icon by level, or a bolt while charging
        char bat[8] = "";
        const char *bat_icon = nullptr;
        if (id(battery_pct).has_state() && !std::isnan(id(battery_pct).state)) {
          float b = id(battery_pct).state;
          snprintf(bat, sizeof(bat), "%.0f%%", b);
          if (id(usb_power).state) bat_icon = "\U000F0084";
          else bat_icon = b >= 90 ? "\U000F0079" : b >= 70 ? "\U000F0081" : b >= 50 ? "\U000F007F"
                        : b >= 30 ? "\U000F007D" : b >= 15 ? "\U000F007B" : "\U000F008E";
        }
        int w_bat = bat_icon ? text_width(bat_icon, id(i_small)) + 4 + text_width(bat, id(f_small)) + 16 : 0;
        int w_time = footer[0] ? text_width(clock_icon, id(i_small)) + 8 + text_width(footer, id(f_small)) : 0;
        int cw = w_bat + w_time + 28;
        if (cw > 28) {
          int x = 790 - cw;
          box(x, y0, cw, bar_h, 10);
          x += 14;
          if (bat_icon) {
            it.print(x, cy, id(i_small), INK, TextAlign::CENTER_LEFT, bat_icon);
            x += text_width(bat_icon, id(i_small)) + 4;
            it.print(x, cy, id(f_small), INK, TextAlign::CENTER_LEFT, bat);
            x += text_width(bat, id(f_small)) + 16;
          }
          if (footer[0]) {
            it.print(x, cy, id(i_small), INK, TextAlign::CENTER_LEFT, clock_icon);
            x += text_width(clock_icon, id(i_small)) + 8;
            it.print(x, cy, id(f_small), INK, TextAlign::CENTER_LEFT, footer);
          }
        }
      }
